<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habesha Eatery Menu Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="menu-card">
    <h2>Habesha Eatery <span>menu</span></h2>
    <h3>breakfast</h3>
    <ul class="menu-list">
      <li class="menu-item">
        <span class="item-name">Chechebsa</span>
        <span class="item-price">185</span>
      </li>
      <li class="menu-item">
        <span class="item-name">Firfir</span>
        <span class="item-price">210</span>
      </li>
    </ul>
    <h3>lunch</h3>
    <ul class="menu-list">
      <li class="menu-item">
        <span class="item-name">Tibis</span>
        <span class="item-price">320</span>
      </li>
      <li class="menu-item">
        <span class="item-name">Shekla Tibis</span>
        <span class="item-price">390</span>
      </li>
    </ul>
    <h3>soft drinks</h3>
    <ul class="menu-list">
      <li class="menu-item">
        <span class="item-name">1 Litter Water</span>
        <span class="item-price">60</span>
      </li>
      <li class="menu-item">
        <span class="item-name">Soda (can)</span>
        <span class="item-price">45</span>
      </li>
    </ul>
  </div>
</body>
</html>
