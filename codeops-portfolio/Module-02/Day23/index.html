<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Addis Eats</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Addis Eats</h1>
      <p class="tagline">The best taste in town</p>
      <div class="search-wrap">
        <label for="search" class="visually-hidden">Search dishes</label>
        <input
          id="search"
          type="search"
          placeholder="Search for doro wat, shiro, kitfo…"
          autocomplete="off"
        />
      </div>
    </header>

    <main>
      <section id="menu" class="menu" aria-label="Menu">
        <p class="status-message">Loading menu…</p>
      </section>

      <aside id="cart" class="cart" aria-label="Your order"></aside>
    </main>

    <footer class="site-footer">
      <p>Addis Eats · Bole, Addis Ababa</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
