<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Eatery</title>
    <meta name="description" content="Habesha Eatery reservation and menu">
</head>
<body>
<h1>Habesha Eatery</h1>
<h2>Reserve a Table</h2>
<form>
    <label for="name">Name</label><br>
    <input type="text" id="name"  required><br><br>

    <label for="phone">Phone</label><br>
    <input type="tel" id="phone"  pattern="09[0-9]{8}" placeholder="09xxxxxxxx" required><br><br>

    <label for="guests">Guests</label><br>
    <input type="number" id="guests"  min="1" max="20" required><br><br>

    <label for="date">Date</label><br>
    <input type="date" id="date"  required><br><br>

    <button type="submit">Reserve</button>
</form>

<h2>Menu</h2>

<table border="1">
    <caption>Menu</caption>

    <tr>
        <th scope="col">Food</th>
        <th scope="col">Price (ETB)</th>
    </tr>

    <tr>
        <td>Doro Wat</td>
        <td>350</td>
    </tr>

    <tr>
        <td>Tibs</td>
        <td>300</td>
    </tr>

    <tr>
        <td>Shiro</td>
        <td>200</td>
    </tr>
</table>

<h2>Our Restaurant</h2>

<img src="../Day12/assets/hero.jpg.jpg" alt="Habesha traditional food" loading="lazy" width="500">

<h2>Location</h2>

</body>
</html>
